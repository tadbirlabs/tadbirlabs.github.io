<meta property="og:title" content="حمّل تدبير مجانًا">
<meta property="og:description" content="مصاريفك وميزانيتك وأهدافك، بالعربي وبدون نت.">
<meta property="og:type" content="website">

<meta name="theme-color" content="#071A45">
<script>
// Store link for the TikTok bio and ads: phones go straight to their store;
// desktops (and ?stay, for previews) see both badges.
var APP_STORE = 'https://apps.apple.com/app/id6756894036';

// Google Play hands `referrer` to the install, so Play Console can credit the
// campaign. utm_* parameters on this page are passed on; TikTok is the default.
function playUrl() {
  var utm = new URLSearchParams({utm_source: 'tiktok', utm_medium: 'social', utm_campaign: 'gulf_launch'});
  new URLSearchParams(location.search).forEach(function (value, key) {
    if (/^utm_/.test(key)) utm.set(key, value);
  });
  return 'https://play.google.com/store/apps/details?id=com.tadbirlabs.tadbir&referrer=' +
    encodeURIComponent(utm.toString());
}

(function () {
  if (new URLSearchParams(location.search).has('stay')) return;
  var ua = navigator.userAgent || '';
  // iPadOS reports a desktop Mac user agent, but has a touch screen.
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  // replace(), not href: going back from the store must not bounce here again.
  if (/Android/i.test(ua)) location.replace(playUrl());
  else if (isIOS) location.replace(APP_STORE);
})();
</script>
<style>

  .points { list-style: none; padding: 0; margin: 32px 0 0; color: rgba(255, 255, 255, 0.85); line-height: 2; }

  footer { margin-top: 36px; font-size: 0.75rem; color: rgba(255, 255, 255, 0.55); line-height: 1.7; }
  footer a { color: rgba(255, 255, 255, 0.75); }
</style>

<script>
